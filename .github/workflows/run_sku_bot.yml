name: Run Data Bot

# ตั้งค่าเหตุการณ์ในการสั่งให้บอททำงาน
on:
  schedule:
    - cron: '0 0 * * *' # 🕒 ตั้งเวลาให้บอทรันอัตโนมัติทุกวันตอนเที่ยงคืน (ตามเวลา UTC)
  workflow_dispatch:      # 🔘 ปุ่มกดรันแมนนวลเอง + รับค่าจากหน้าเว็บ
    inputs:
      manual_upload:
        description: 'Manual File Upload Trigger'
        required: false
        default: 'false'
      file_name:
        description: 'File Name'
        required: false
        default: ''

jobs:
  build:
    # 🛠️ จุดแก้ไขที่ 1: ล็อคเวอร์ชัน OS เป็น ubuntu-24.04
    runs-on: ubuntu-24.04
    
    steps:
      # 🛠️ จุดแก้ไขที่ 2: อัปเดต checkout เป็น v4.2.2 (รองรับ Node.js 24)
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2

      # 🛠️ จุดแก้ไขที่ 3: อัปเดต setup-python เป็น v5.3.0 (รองรับ Node.js 24)
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.9'

      # 3. ติดตั้ง Chrome Browser และ Library พร้อมอัปเดตเวอร์ชันล่าสุด
      - name: Install Chrome and dependencies
        run: |
          # 🌐 ติดตั้ง Chrome Browser สำหรับ Selenium
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # 🐍 อัปเดตเครื่องมือติดตั้งและสั่งอัปเกรด google-cloud-bigquery ให้เป็นตัวใหม่ล่าสุด
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-cloud-bigquery
          
          # ติดตั้ง library อื่นๆ ที่มีในไฟล์ของคุณเพิ่มเติม
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🛠️ จุดแก้ไขที่ 4: อัปเดต Google Auth เป็น v2.1.8 (รองรับ Node.js 24)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 5. สั่งรันสคริปต์ Python เพื่อดาวน์โหลดไฟล์และส่งเข้า BigQuery (รองรับ Manual Upload)
      - name: Run Python Script
        run: python silom_sku.py
        env:
          IS_MANUAL_UPLOAD: '${{ github.event.inputs.manual_upload }}'
          MANUAL_FILE_NAME: '${{ github.event.inputs.file_name }}'

      # 🌟 6. บันทึกและส่งไฟล์เวลาอัปเดตจาก BigQuery กลับเข้า GitHub Repo อัตโนมัติ (ขึ้นจุดเขียว)
      - name: Commit and Push Last Update Time
        run: |
          if [ -f sku_last_update.txt ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add sku_last_update.txt
            git commit -m "Auto-update last modified time from BigQuery [skip ci]" || true
            git push
          fi
