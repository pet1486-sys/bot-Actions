name: Run Sales Data Bot

# ตั้งค่าเหตุการณ์ในการสั่งให้บอททำงาน
on:
  schedule:
    - cron: '37 13 * * *' # 🕒 ตั้งเวลารันอัตโนมัติทุกวันตอน 14:00 UTC (ตรงกับ 20:37 น. เวลาประเทศไทย)
  workflow_dispatch:      # 🔘 ปุ่มกดรันแมนนวลเอง + รับค่าจากหน้าเว็บ
    inputs:
      manual_upload:
        description: 'Manual File Upload Trigger'
        required: false
        default: 'false'
      file_name:
        description: 'File Name'
        required: false
        default: ''

jobs:
  build:
    # 🛠️ จุดแก้ไขที่ 1: ล็อคเวอร์ชัน OS เป็น ubuntu-24.04 (แก้ Error หา Python 3.9 ไม่เจอ)
    runs-on: ubuntu-24.04
    
    steps:
      # 🛠️ จุดแก้ไขที่ 2: อัปเดต checkout เป็น v4
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 🛠️ จุดแก้ไขที่ 3: อัปเดต setup-python เป็น v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. ติดตั้ง Chrome Browser และ Library พร้อมอัปเดตเวอร์ชันล่าสุด
      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-cloud-bigquery
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🛠️ จุดแก้ไขที่ 4: อัปเดต Google Auth เป็น v2
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 5. สั่งรันสคริปต์ Python (รองรับทั้งระบบออโต้และ Manual Upload)
      - name: Run Python Script
        run: python silom_sales.py
        env:
          IS_MANUAL_UPLOAD: '${{ github.event.inputs.manual_upload }}'
          MANUAL_FILE_NAME: '${{ github.event.inputs.file_name }}'

      # 6. บันทึกและส่งไฟล์เวลาอัปเดตของยอดขายกลับเข้า GitHub Repo อัตโนมัติ (สร้างจุดเขียว)
      - name: Commit and Push Last Update Time
        run: |
          if [ -f sales_last_update.txt ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add sales_last_update.txt
            git commit -m "Auto-update sales last modified time from BigQuery [skip ci]" || true
            git push
          fi

      # 7. อัปโหลดภาพหน้าจอตอนพังขึ้นระบบ GitHub (แสดง Warning ปกติหากหาโฟลเดอร์ไม่เจอ)
      - name: Upload Error Screenshot if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sales-bot-error-screenshot
          path: /home/runner/work_screenshots/
